<div class="main flex flex-col h-full px-4">

    <header class="header flex justify-between p-4  my-4 ">
        <h2 class="text-2xl">Story</h2>
        <h1 class="font-bold text-3xl">Who Owns My Pub?</h1>
        <h2 class="text-2xl">About</h2>
    </header>

    <div id="map" class="map h-full w-full pb-4 mb-4"></div>
    </div>

    <script>
    var map = L.map('map').setView([51.505, -0.09], 13);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    fetch('Lambeth_pubsFinal.xlsx - Sheet1.geojson')
    .then(response => response.json())
    .then(data => {

        L.geoJSON(data, {
            onEachFeature: function(feature, layer) {

                if (feature.properties) {
                    layer.bindPopup(
                        '<div class="text-lg font-bold">' + feature.properties.name + '</div>' +
                        '<p class="text-sm font-normal">' + feature.properties.owner + '</p>'

                    );
                }

            }
        }).addTo(map);

    })
    .catch(error => console.error('Error loading GeoJSON:', error));

    fetch('Wandsworth_pubsFinal.geojson')
    .then(response => response.json())
    .then(data => {
        L.geoJSON(data, {
            onEachFeature: function(feature, layer){
                if (feature.properties){
                    layer.bindPopup(
                        '<div class="text-lg font-bold">' + feature.properties.name + '</div>' +
                        '<p class="text-sm font-normal m-0">' + feature.properties.owner + '</p>'
                    );
                    
                }
            }
        }).addTo(map);

    })
    .catch(error => console.error('Error loading GeoJSON:', error));

    fetch('Kensington_pubsFinal.geojson')
    .then(response => response.json())
    .then(data => {
        L.geoJSON(data, {
            onEachFeature: function(feature, layer){
                if (feature.properties){
                    layer.bindPopup(
                        '<div class="text-lg font-bold">' + feature.properties.name + '</div>' +
                        '<p class="text-sm font-normal m-0">' + feature.properties.owner + '</p>'
                    );
                }
            }
        }).addTo(map);
    })
    .catch(error => console.error('Error loading GeoJSON:', error));



    



    </script>
