    <script>
    var map = L.map('map').setView([51.505, -0.09], 13);

    function bubbleIcon(color) {
        return L.divIcon({
            className: '',
            html: `<svg width="26" height="34" viewBox="0 0 26 34" xmlns="http://www.w3.org/2000/svg">
                     <path d="M13 0C5.8 0 0 5.8 0 13c0 9.75 13 21 13 21s13-11.25 13-21C26 5.8 20.2 0 13 0z"
                           fill="${color}" stroke="#000" stroke-width="1"/>
                     <circle cx="13" cy="13" r="5.5" fill="#fff"/>
                   </svg>`,
            iconSize: [26, 34],
            iconAnchor: [13, 34],
            popupAnchor: [0, -30]
        });
    }

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    fetch('Lambeth_pubsFinal.xlsx - Sheet1.geojson')
    .then(response => response.json())
    .then(data => {

       

        L.geoJSON(data, {
            pointToLayer: function (feature, latlng) {
                const owner = feature.properties.owner;
                var color = '#3388ff'; // Default color

                if (owner === 'Greene King') {
                    color = '#005A40';
                } else if (owner === "Young's") {
                    color = '#DFC026';
                } else if (owner === 'Fuller Smith & Turner') {
                    color = '#C8102E';
                } else if (owner === 'Mitchells & Butlers') {
                    color = '#d97706';
                } else if (owner === 'Stonegate') {
                    color = '#99927f';
                } 

                return L.marker(latlng, {
                    icon: bubbleIcon(color),
                    interactive: true
                });
            },


            onEachFeature: function(feature, layer) {

                if (feature.properties) {
                    layer.bindPopup(
                        '<div class="text-lg font-bold">' + feature.properties.name + '</div>' +
                        '<p class="text-sm font-normal">' + feature.properties.owner + '</p>'

                    );
                }

            }
        }).addTo(map);

    })
    .catch(error => console.error('Error loading GeoJSON:', error));
